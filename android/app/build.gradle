plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.meowwoof.translator"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.meowwoof.translator"
        // Vosk 需要 21+；image_picker / audioplayers 与 24 兼容
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true

        // v1.6.0：默认同时打包 arm64-v8a（真机）+ x86_64（雷电/安卓模拟器）。
        // 纯 arm 的 APK 在 LDPlayer 等 x86_64 模拟器上会 INSTALL_FAILED_NO_MATCHING_ABIS。
        // 只留这两个 ABI，配合 `flutter build apk --release --split-per-abi` 正好出"两个包"：
        //   app-arm64-v8a-release.apk（真机测试）+ app-x86_64-release.apk（模拟器测试）。
        ndk {
            abiFilters += listOf("arm64-v8a", "x86_64")
        }
    }

    buildTypes {
        release {
            // 纯离线 App：debug 签名即可侧载；上架前替换为自己的 release 签名
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 离线语音识别（Vosk 官方 Android 库，Maven Central）
    // 与官方 demo 相同的 jna@aar 写法；两者均无 Google 服务依赖
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
    implementation "net.java.dev.jna:jna:5.13.0@aar"

    // v1.4.0 体态识别：TFLite 运行时（仅体态模块使用，语音/播放不依赖）
    implementation "org.tensorflow:tensorflow-lite:2.14.0"
}
