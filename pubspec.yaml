name: meowwoof_translator
description: "毛语通 1.0.0：离线人声识别（Vosk 中文小模型）→ 意图匹配 → 播放猫语/狗语叫声。10 个预设叫声（猫狗两套，带用途说明）、录宠物声音做音高分析（音色匹配）、拍照设宠物头像。纯离线，无网络权限。"
publish_to: 'none'
version: 1.4.0+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 拍照 / 相册选头像
  image_picker: ^1.1.2
  # 宠物资料持久化
  shared_preferences: ^2.3.2
  # 头像文件落到应用文档目录
  path_provider: ^2.1.5
  # 注意：语音识别（Vosk）、录音与音高分析、叫声播放全部在 Android 原生层
  # 实现（MainActivity.kt），不引入任何联网 SDK，不申请网络权限。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 20 条叫声（猫 10 + 狗 10）由 tools/synth_calls.py 合成后提交进仓库
  assets:
    - assets/sounds/
